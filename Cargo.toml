[workspace]
members = [
    "crates/app",
    "crates/defs",
    "crates/features/*",
    "crates/helpers",
    "crates/features/slintui",
    "crates/features/sqlitedb",
]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software", # fallback
] }
slint-interpreter = "1.18.1"
serde = "1.0.229"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
diesel = { version = "2.3.12", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35", "r2d2"] }
# build libsqlite3 as part of the build process
# uncomment this line if you run into setup issues
# libsqlite3-sys = { version = "0.30", features = ["bundled"] }
cpal = "0.18.2"
symphonia = "0.6.1"
lofty = "0.25.4"
dirs = "7.0.0"
walkdir = "2.5.0"
chrono = "0.4.45"
toml_edit = { version = "0.25.17", features = ["display", "parse", "serde", "unbounded"] }
ahash = "0.8.12"
clap = { version = "4.6.7", features = ["derive"] }


# Local internal crates:
app = { path = "crates/app" }
defs = { path = "crates/defs" }
helpers = { path = "crates/helpers" }
slintui = { path = "crates/features/slintui" }
sqlitedb = { path = "crates/features/sqlitedb" }
