[package]
name = "RAMP"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18.1"
diesel = { version = "2.3.12", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35", "r2d2"] }
# build libsqlite3 as part of the build process
# uncomment this line if you run into setup issues
# libsqlite3-sys = { version = "0.30", features = ["bundled"] }
cpal = "0.18.2"
symphonia = "0.6.1"
lofty = "0.25.4"
dirs = "7.0.0"
walkdir = "2.5.0"
chrono = "0.4.45"
toml_edit = { version = "0.25.17", features = ["display", "parse", "serde", "unbounded"] }
serde = "1.0.229"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ahash = "0.8.12"
clap = { version = "4.6.7", features = ["derive"] }

[build-dependencies]
slint-build = "1.16.1"
